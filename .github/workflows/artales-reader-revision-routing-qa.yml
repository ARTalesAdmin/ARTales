name: ARTales Reader routing preflight QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'lib/publication/readerRevisionRouting.ts'
      - 'tests/readerRevisionRouting.test.ts'
      - '.github/workflows/artales-reader-revision-routing-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx --test tests/readerRevisionRouting.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint lib/publication/readerRevisionRouting.ts tests/readerRevisionRouting.test.ts
