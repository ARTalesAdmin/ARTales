name: ARTales E2 readback verifier QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'lib/semantic/verifySignedReadback.ts'
      - 'tests/verifySignedReadback.test.ts'
      - '.github/workflows/artales-e2-readback-verifier-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx --test tests/verifySignedReadback.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint lib/semantic/verifySignedReadback.ts tests/verifySignedReadback.test.ts
