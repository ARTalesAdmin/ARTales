name: Semantic Reader Composer v2 QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'lib/semantic/**'
      - 'tests/semanticReaderV2.test.ts'
      - 'tests/semanticDisplayText.test.ts'
      - '.github/workflows/artales-semantic-reader-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx --test tests/semanticReaderV2.test.ts tests/semanticDisplayText.test.ts tests/gutenbergIngest.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint lib/semantic tests/semanticReaderV2.test.ts
