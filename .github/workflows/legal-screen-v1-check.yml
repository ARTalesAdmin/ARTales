name: ARTales Legal Screen v1 source checks
on:
  push:
    branches:
      - feat/legal-screen-v1-source-20261025
      - release/artales-legal-screen-v1-enable-20261025
      - feat/artales-legal-one-click-screen-20261025
      - fix/artales-gutenberg-opds-catalog-20261025
      - fix/artales-legal-search-zero-results-20261025
      - fix/artales-legal-screen-workflow-20261025
      - feat/artales-legal-screen-automatic-v2-20261025
      - fix/artales-legal-simple-rights-20261025
      - fix/artales-legal-rdf-person-years-20261026
      - fix/artales-legal-component-check-20261026
      - fix/artales-legal-decision-first-20261026
      - fix/artales-legal-review-handoff-20261026
      - fix/artales-legal-overview-statuses-20261026
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/legal-screen-v1-check.yml'
      - 'app/member/candidates/**/legal/**'
      - 'app/member/legal/**'
      - 'app/member/legal/page.tsx'
      - 'components/legal/**'
      - 'lib/legal/**'
      - 'tests/legal-*.test.ts'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Legal screen source contracts
        run: node --test tests/legal-screen-v1.contract.test.mjs
      - name: Edition decision tests
        run: npx tsx --test tests/legal-edition-recommendation.test.ts tests/legal-gutenberg-catalog.test.ts tests/legal-gutenberg-opds.test.ts
      - name: Live Gutenberg #389 integration smoke
        run: npx tsx --test tests/legal-gutenberg-live.test.ts tests/legal-automatic-assessment.test.ts tests/legal-simple-rights.test.ts tests/legal-gutenberg-rdf.test.ts tests/legal-component-terms.test.ts tests/legal-openlibrary-hint.test.ts tests/legal-epub-inspection.test.ts tests/legal-public-domain-check.test.ts tests/legal-overview-status.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped eslint
        run: npx eslint lib/actions/legalScreen.ts app/member/candidates/'[id]'/legal/page.tsx components/legal/AutomaticLegalScreen.tsx lib/legal/automaticAssessment.ts app/member/candidates/'[id]'/legal/automatic/route.ts
      - name: Build
        run: npm run build
