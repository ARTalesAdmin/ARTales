name: ARTales semantic editorial integration
on:
  push:
    branches: [fix/reader-chromium-parity-20261117]
    paths:
      - 'lib/semantic/**'
      - 'tests/semanticReaderPageFit20261115.test.ts'
      - 'tests/chromium_reader_layout.py'
      - 'components/reader/**'
      - '.github/workflows/artales-semantic-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/semantic/**'
      - 'components/reader/SemanticReaderClient.tsx'
      - 'components/reader/SemanticPageUnit.tsx'
      - 'components/reader/semantic-public-reader.css'
      - 'tests/semanticReaderPageFit20261115.test.ts'
      - 'app/api/internal/editorial/ai-qa-jobs/**'
      - 'app/member/admin/ai-usage/**'
      - 'ops/sql/20261104_artales_ai_qa_durable_jobs.sql'
      - 'ops/sql/20261104_artales_qa_change_decisions_v4.sql'
      - 'ops/sql/20261104_artales_qa_closeout_v4.sql'
      - 'ops/sql/20261104_artales_safe_layout_commit_v4.sql'
      - 'ops/sql/20261106_artales_ai_gateway_usage.sql'
      - 'tests/semanticAiQueue.test.ts'
      - 'tests/semanticQaP0Integration.test.ts'
      - 'tests/artalesAiGatewayUsage.test.ts'
      - 'lib/ingest/epubSemanticExtractor.ts'
      - 'components/editor/Semantic*'
      - 'app/api/member/semantic/**'
      - 'app/member/semantic/**'
      - 'ops/sql/20261103_artales_semantic_qa_block_workflow.sql'
      - 'ops/sql/20261103_artales_editorial_assignments_v2.sql'
      - 'ops/sql/20261103_artales_qa_batch_edition_rules_escalations.sql'
      - 'components/reader/ProtectedProseText.tsx'
      - 'app/member/editorial-help/**'
      - 'app/reader/[slug]/page.tsx'
      - 'tests/semanticQaBatch.test.ts'
      - 'tests/semanticGutenbergApparatusGeneral.test.ts'
      - 'supabase/migrations/20261111133000_artales_editorial_exclusion_and_author_guard.sql'
      - 'components/member/**'
      - 'lib/editorial/**'
      - 'supabase/migrations/20261110130000_artales_unique_existing_author_byline.sql'
      - 'tests/editorialTaskEntryAuthorMatch.test.ts'
      - 'tests/editorialAuthorCreationHandoff.test.ts'
      - 'tests/editorialCoverRecovery.test.ts'
      - 'tests/editorialUiProgressCompact.test.ts'
      - 'components/editor/EditorialPendingButton.tsx'
      - 'app/member/admin/editorial-performance/**'
      - 'app/member/admin/dashboard/page.tsx'
      - 'ops/sql/20261106_artales_editorial_completion_bilingual_guard.sql'
      - 'tests/editorialTaskReporting.test.ts'
      - 'app/member/editorial-pipeline/**'
      - 'app/member/editorial-detail/**'
      - 'app/member/authors/**'
      - 'lib/actions/authors.ts'
      - 'app/member/collections/**'
      - 'lib/forms/authorForm.ts'
      - 'lib/forms/collectionForm.ts'
      - 'lib/actions/authors.ts'
      - 'lib/actions/collections.ts'
      - 'components/editor/BilingualProfileText.tsx'
      - 'tests/editorialAuthorCollectionBilingual.test.ts'
      - 'ops/sql/20261105_artales_author_collection_bilingual_evidence.sql'
      - 'components/editor/CandidateCoverInput.tsx'
      - 'components/editor/CandidateBilingualAnnotationFields.tsx'
      - 'ops/sql/20261105_artales_candidate_bilingual_descriptions.sql'
      - 'tests/editorialBilingualAnnotations.test.ts'
      - 'components/editor/editorial-workspace.css'
      - 'tests/editorialWorkspacePolish.test.ts'
      - 'ops/sql/20261105_artales_candidate_editorial_metadata_gate.sql'
      - 'tests/editorialCandidateRelease.test.ts'
      - 'tests/editorialPoolProductionRelease.test.ts'
      - 'tests/editorialReleaseCanonical.test.ts'
      - 'ops/sql/20261114_artales_release_author_contract_SOURCE_ONLY.sql'
      - 'app/member/layout.tsx'
      - 'tests/editorialOwnershipV2.test.ts'
      - 'tests/semanticQaWorkflow.test.ts'
      - 'components/editor/semantic-reader.css'
      - 'components/editor/semantic-reader-theme.css'
      - 'tests/semanticReaderThemeContrast.test.mjs'
      - 'components/reader/SemanticPublicReader.tsx'
      - 'supabase/migrations/20261102172000_artales_semantic_editorial_pipeline.sql'
      - '.github/workflows/artales-semantic-integration.yml'
permissions:
  contents: read
jobs:
  semantic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint scoped files
        run: npx eslint lib/semantic lib/ingest/epubSemanticExtractor.ts components/editor/SemanticReaderLab.tsx components/editor/SemanticReaderNotesQa.tsx app/api/internal/editorial/ai-qa-jobs/route.ts app/member/admin/ai-usage/page.tsx components/editor/SemanticQaPanel.tsx 'app/member/semantic/[candidateId]/qa-actions.ts' 'app/member/semantic/[candidateId]/page.tsx' app/member/editorial-pipeline/actions.ts app/member/editorial-pipeline/page.tsx 'app/member/editorial-detail/[candidateId]/actions.ts' 'app/member/editorial-detail/[candidateId]/page.tsx' components/editor/CandidateCoverInput.tsx components/editor/CandidateBilingualAnnotationFields.tsx components/editor/BilingualProfileText.tsx components/member/MemberZoneNav.tsx components/member/MemberHelpButton.tsx app/member/editorial-help/actions.ts app/member/layout.tsx components/reader/ProtectedProseText.tsx components/reader/SemanticReaderClient.tsx components/reader/SemanticPageUnit.tsx 'app/reader/[slug]/page.tsx' 'app/api/member/semantic/[candidateId]/compose/route.ts'
      - name: Existing semantic regression
        run: npx tsx --test tests/semanticReaderV2.test.ts
      - name: Published Reader pagination coverage and page-boundary regression
        run: npx tsx --test tests/semanticReaderPageFit20261115.test.ts
      - name: Original Reader palette and QA dark/light contrast regression
        run: node --test tests/semanticReaderThemeContrast.test.mjs
      - name: PostgreSQL jsonb roundtrip and legacy revision integrity
        run: npx tsx --test tests/semanticJsonbRoundtrip.test.ts
      - name: Editable public-domain edition and pagination regression
        run: npx tsx --test tests/semanticEditionLayout.test.ts
      - name: General Gutenberg automatic omission and manual exclusion
        run: npx tsx --test tests/semanticGutenbergApparatusGeneral.test.ts
      - name: Source-anchored QA feedback, typography and immutable re-review
        run: npx tsx --test tests/semanticQaWorkflow.test.ts
      - name: Voluntary task pool and governed owner transfer
        run: npx tsx --test tests/editorialPoolProductionRelease.test.ts
      - name: Bilingual author and collection editorial workflow
        run: npx tsx --test tests/editorialAuthorCollectionBilingual.test.ts
      - name: Assigned-task entry and existing-author regression
        run: npx tsx --test tests/editorialTaskEntryAuthorMatch.test.ts
      - name: Candidate author creation and recoverable cover linkage
        run: npx tsx --test tests/editorialAuthorCreationHandoff.test.ts
      - name: Required bilingual annotation UI and DB evidence
        run: npx tsx --test tests/editorialBilingualAnnotations.test.ts
      - name: Editorial workspace design and functionality safety
        run: npx tsx --test tests/editorialWorkspacePolish.test.ts
      - name: Candidate cover save and existing upload recovery
        run: npx tsx --test tests/editorialCoverRecovery.test.ts
      - name: Progress state, compact visual fields and no redundant confirmation
        run: npx tsx --test tests/editorialUiProgressCompact.test.ts
      - name: Editorial candidate release evidence and legacy safety
        run: npx tsx --test tests/editorialCandidateRelease.test.ts
      - name: Canonical publication gate and author handoff source-only contract
        run: npx tsx --test tests/editorialReleaseCanonical.test.ts
      - name: Editorial assignment and review workflow contract
        run: npx tsx --test tests/editorialOwnershipV2.test.ts
      - name: Atomic batch and disputed-note semantic evidence
        run: npx tsx --test tests/semanticQaBatch.test.ts
      - name: Editorial task completion and admin reporting
        run: npx tsx --test tests/editorialTaskReporting.test.ts
      - name: Safe semantic AI queue, revision and review contract
        run: npx tsx --test tests/semanticAiQueue.test.ts tests/semanticQaP0Integration.test.ts tests/semanticProtectedTermsVisualParity.test.ts
      - name: Vercel Gateway token and privacy contract
        run: npx tsx --test tests/artalesAiGatewayUsage.test.ts

  chromium-reader-layout:
    # Playwright 1.56.0 supports Ubuntu 24.04; ubuntu-latest is 26.04 here.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check public Reader with actual Chromium DOM geometry
        env:
          ARTALES_READER_URL: https://artales.net/reader/the-great-god-pan?mode=full
          ARTALES_READER_MODE: diagnostic
        run: python tests/chromium_reader_layout.py
      - name: Preserve public-page screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artales-chromium-reader-layout
          path: reader-chromium-artifacts/
          if-no-files-found: warn
