name: ARTales semantic editorial integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/semantic/**'
      - 'lib/ingest/epubSemanticExtractor.ts'
      - 'components/editor/Semantic*'
      - 'app/api/member/semantic/**'
      - 'app/member/semantic/**'
      - 'ops/sql/20261103_artales_semantic_qa_block_workflow.sql'
      - 'ops/sql/20261103_artales_editorial_assignments_v2.sql'
      - 'ops/sql/20261104_artales_editorial_pool_ownership_v3.sql'
      - 'ops/sql/20261104_artales_ai_qa_durable_jobs.sql'
      - 'ops/sql/20261104_artales_qa_change_decisions_v4.sql'
      - 'ops/sql/20261104_artales_qa_closeout_v4.sql'
      - 'ops/sql/20261104_artales_safe_layout_commit_v4.sql'
      - 'ops/sql/20261104_artales_monthly_methodology_review.sql'
      - 'app/api/internal/editorial/methodology-review/route.ts'
      - 'app/api/internal/editorial/ai-qa-jobs/route.ts'
      - 'vercel.json'
      - 'ops/sql/20261103_artales_qa_batch_edition_rules_escalations.sql'
      - 'components/reader/ProtectedProseText.tsx'
      - 'app/member/editorial-help/**'
      - 'app/reader/[slug]/page.tsx'
      - 'tests/semanticQaBatch.test.ts'
      - 'components/member/**'
      - 'app/member/editorial-pipeline/**'
      - 'app/member/layout.tsx'
      - 'tests/editorialOwnershipV2.test.ts'
      - 'tests/editorialPoolV3.test.ts'
      - 'tests/semanticPaginationMatrix.test.ts'
      - 'tests/semanticCanonicalRenderer.test.ts'
      - 'tests/semanticAiQueue.test.ts'
      - 'tests/semanticQaReviewCycleV4.test.ts'
      - 'tests/semanticQaWorkflow.test.ts'
      - 'components/editor/semantic-reader.css'
      - 'components/reader/SemanticPublicReader.tsx'
      - 'components/reader/SemanticReaderClient.tsx'
      - 'components/reader/SemanticUnitContent.tsx'
      - 'components/reader/semantic-public-reader.css'
      - 'supabase/migrations/20261102172000_artales_semantic_editorial_pipeline.sql'
      - '.github/workflows/artales-semantic-integration.yml'
permissions:
  contents: read
jobs:
  semantic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint scoped files
        run: npx eslint lib/semantic lib/ingest/epubSemanticExtractor.ts components/editor/SemanticReaderLab.tsx components/editor/SemanticReaderNotesQa.tsx components/editor/SemanticQaPanel.tsx 'app/member/semantic/[candidateId]/qa-actions.ts' 'app/member/semantic/[candidateId]/ai-qa-actions.ts' 'app/member/semantic/[candidateId]/ai-job-actions.ts' app/api/internal/editorial/ai-qa-jobs/route.ts 'app/member/semantic/[candidateId]/page.tsx' app/member/editorial-pipeline/actions.ts app/member/editorial-pipeline/page.tsx components/member/MemberZoneNav.tsx components/member/MemberHelpButton.tsx app/member/editorial-help/actions.ts app/member/layout.tsx components/reader/ProtectedProseText.tsx components/reader/SemanticReaderClient.tsx components/reader/SemanticUnitContent.tsx components/reader/SemanticPublicReader.tsx 'app/reader/[slug]/page.tsx' 'app/api/member/semantic/[candidateId]/compose/route.ts'
      - name: Existing semantic regression
        run: npx tsx --test tests/semanticReaderV2.test.ts
      - name: PostgreSQL jsonb roundtrip and legacy revision integrity
        run: npx tsx --test tests/semanticJsonbRoundtrip.test.ts
      - name: Editable public-domain edition and pagination regression
        run: npx tsx --test tests/semanticEditionLayout.test.ts
      - name: Source-anchored QA feedback, typography and immutable re-review
        run: npx tsx --test tests/semanticQaWorkflow.test.ts
      - name: Editorial assignment and review workflow contract
        run: npx tsx --test tests/editorialOwnershipV2.test.ts
      - name: Canonical semantic renderer parity (QA vs public)
        run: npx tsx --test tests/semanticCanonicalRenderer.test.ts
      - name: Browser layout repagination source preservation
        run: npx tsx --test tests/semanticPaginationMatrix.test.ts
      - name: Human QA acceptance, source-safe commits, workflow and methodology
        run: npx tsx --test tests/semanticQaReviewCycleV4.test.ts
      - name: Durable AI proposal queue, worker security and resume
        run: npx tsx --test tests/semanticAiQueue.test.ts
      - name: Editorial pool, audit and AI proposal boundary
        run: npx tsx --test tests/editorialPoolV3.test.ts
      - name: Atomic batch and disputed-note semantic evidence
        run: npx tsx --test tests/semanticQaBatch.test.ts
