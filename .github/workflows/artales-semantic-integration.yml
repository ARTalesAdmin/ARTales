name: ARTales semantic editorial integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/semantic/**'
      - 'lib/ingest/epubSemanticExtractor.ts'
      - 'components/editor/Semantic*'
      - 'app/api/member/semantic/**'
      - 'app/member/semantic/**'
      - 'supabase/migrations/20261102172000_artales_semantic_editorial_pipeline.sql'
      - '.github/workflows/artales-semantic-integration.yml'
permissions:
  contents: read
jobs:
  semantic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint scoped files
        run: npx eslint lib/semantic lib/ingest/epubSemanticExtractor.ts components/editor/SemanticReaderLab.tsx components/editor/SemanticReaderNotesQa.tsx 'app/member/semantic/[candidateId]/page.tsx' 'app/api/member/semantic/[candidateId]/compose/route.ts'
      - name: Existing semantic regression
        run: npx tsx --test tests/semanticReaderV2.test.ts
      - name: PostgreSQL jsonb roundtrip and legacy revision integrity
        run: npx tsx --test tests/semanticJsonbRoundtrip.test.ts
