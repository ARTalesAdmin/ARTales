name: ARTales Alice ephemeral migration replay QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'supabase/pilot/build_alice_preview_migration.mjs'
      - 'supabase/ci/alice_e2_signed_draft_assembly.sql'
      - 'supabase/ci/alice_e2_approval_proof.sql'
      - 'supabase/ci/test_alice_e2_signed.sql'
      - '.github/workflows/artales-alice-migration-replay-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Initialize isolated local database
        run: |
          supabase init --force
          supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate CLI-timestamped migration from reviewed provisional sources
        run: |
          supabase migration new artales_alice_e2_preview
          migration="$(find supabase/migrations -maxdepth 1 -name '*_artales_alice_e2_preview.sql' -print -quit)"
          test -n "$migration"
          node supabase/pilot/build_alice_preview_migration.mjs "$migration"
      - name: Replay all baseline and generated migration files from scratch
        run: |
          supabase db reset --local --yes
          supabase migration list --local
          psql -X -v ON_ERROR_STOP=1 -f supabase/ci/test_alice_e2_signed.sql
      - name: Check deterministic second reset and no approval release
        run: |
          supabase db reset --local --yes
          psql -X -v ON_ERROR_STOP=1 -f supabase/ci/test_alice_e2_signed.sql
          psql -X -v ON_ERROR_STOP=1 -At -c "select count(*) from artales_evidence.semantic_v2_approvals" | grep '^0$'
      - name: Tear down disposable database
        if: always()
        run: supabase stop --no-backup
