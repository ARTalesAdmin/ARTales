name: ARTales one-migration APPLY source-only proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/artales-production-one-migration-apply.yml'
      - '.github/workflows/artales-one-migration-apply-source-only.yml'
      - 'scripts/artales-production-apply-operator.mjs'
      - 'tests/artalesProductionApplyOperator.test.mjs'
      - 'docs/protocols/ARTALES_PRODUCTION_APPLY_OPERATOR_V0.md'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed tests (no provider access, no secrets)
        run: node --test tests/artalesProductionApplyOperator.test.mjs
