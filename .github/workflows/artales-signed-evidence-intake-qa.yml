name: ARTales signed evidence intake QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'supabase/ci/db_a_authenticated_intake_assembly.sql'
      - 'supabase/ci/test_db_a_authenticated_intake.sql'
      - 'supabase/ci/test_db_a_signed_auth_e2e.mjs'
      - 'supabase/ci/signed_auth_e2e_seed.sql'
      - '.github/workflows/artales-signed-evidence-intake-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-signed-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start disposable signed Supabase
        run: |
          supabase init --force
          supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply DB-A intake draft only locally
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/ci/db_a_authenticated_intake_assembly.sql
      - name: Verify private schema and function grants
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/ci/test_db_a_authenticated_intake.sql
      - name: Signed GoTrue/Auth and denied writes
        run: node supabase/ci/test_db_a_signed_auth_e2e.mjs
      - name: Stop disposable local project
        if: always()
        run: supabase stop --no-backup
