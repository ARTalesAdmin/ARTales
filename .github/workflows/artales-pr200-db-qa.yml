name: ARTales candidate handoff database QA

on:
  pull_request:
    branches: [develop]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/artales-pr200-db-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artales-db-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-qa:
    name: Isolated local Supabase (no production access)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ""
      SUPABASE_DB_PASSWORD: ""
    steps:
      - name: Checkout tested PR commit
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Initialize disposable local project
        run: supabase init --force
      - name: Start only local database and test dependencies
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run isolated pgTAP contract tests
        run: supabase test db --local
      - name: Stop local containers and discard data
        if: always()
        run: supabase stop --no-backup
