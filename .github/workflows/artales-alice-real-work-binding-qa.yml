name: ARTales Alice E1 real work binding QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'lib/pilots/legacyWorkBinding.ts'
      - 'tests/legacyWorkBinding.test.ts'
      - 'lib/pilots/aliceObservedLegacy.ts'
      - 'tests/aliceObservedLegacy.test.ts'
      - 'app/member/works/[slug]/semantic/page.tsx'
      - '.github/workflows/artales-alice-real-work-binding-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binding-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Work identity and fail-closed source binding
        run: npx tsx --test tests/legacyWorkBinding.test.ts tests/aliceObservedLegacy.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint lib/pilots/legacyWorkBinding.ts lib/pilots/aliceObservedLegacy.ts tests/legacyWorkBinding.test.ts tests/aliceObservedLegacy.test.ts 'app/member/works/[slug]/semantic/page.tsx'
