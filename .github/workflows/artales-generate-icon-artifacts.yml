name: ARTales icon artifact generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-icon-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check CairoSVG Pillow

      - name: Generate icon artifacts
        run: python tools/brand/generate-icon-artifacts/generate_icon_artifacts.py

      - name: Upload icon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artales-icon-artifacts
          path: tools/brand/generate-icon-artifacts/output/
          if-no-files-found: error
          retention-days: 14
