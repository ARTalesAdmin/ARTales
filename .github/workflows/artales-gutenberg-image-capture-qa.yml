name: ARTales Gutenberg image capture QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'lib/ingest/gutenbergImageCapturePipeline.ts'
      - 'tests/gutenbergImageCapturePipeline.test.ts'
      - 'lib/pilots/alice114CaptureGate.ts'
      - 'tests/alice114CaptureGate.test.ts'
      - 'app/api/member/ingest/alice-illustration/route.ts'
      - '.github/workflows/artales-gutenberg-image-capture-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx --test tests/gutenbergImageCapturePipeline.test.ts tests/alice114CaptureGate.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint lib/ingest/gutenbergImageCapturePipeline.ts lib/pilots/alice114CaptureGate.ts app/api/member/ingest/alice-illustration/route.ts tests/gutenbergImageCapturePipeline.test.ts tests/alice114CaptureGate.test.ts
