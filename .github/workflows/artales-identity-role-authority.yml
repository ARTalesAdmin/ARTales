name: ARTales identity authority isolated PostgreSQL 17
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261028091029_artales_identity_role_authority_v1.sql'
      - 'tests/db/artalesIdentityFixture.sql'
      - 'tests/db/artalesIdentityIsolation.sh'
      - 'tests/db/artalesInviteBoundary*'
      - 'tests/db/artalesIdentityLifecycle*'
      - 'supabase/migrations/*_artales_identity_lifecycle_v1.sql'
      - 'supabase/migrations/*_artales_invite_access_boundary_v1.sql'
      - 'lib/dbInvites.ts'
      - 'lib/inviteTokenLookup.ts'
      - 'tests/inviteTokenLookup.test.ts'
      - 'lib/actions/invites.ts'
      - 'app/invite/**'
      - 'app/member/invites/**'
      - '.github/workflows/artales-identity-role-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  role-authority-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-root-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Test read-only authority compatibility on synthetic identities
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
        run: bash tests/db/artalesIdentityIsolation.sh
      - name: Prove scoped invite boundary with actual synthetic database roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
        run: bash tests/db/artalesInviteBoundaryIsolation.sh supabase/migrations/20261128094513_artales_invite_access_boundary_v1.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allocate canonical identity for lifecycle candidate (source only)
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/supabase/migrations"
          cd "$work"
          cli=(npm exec --yes --package=supabase@2.122.0 -- supabase)
          "${cli[@]}" --version
          "${cli[@]}" migration new --help
          "${cli[@]}" migration new artales_identity_lifecycle_v1
          shopt -s nullglob
          files=(supabase/migrations/*_artales_identity_lifecycle_v1.sql)
          [[ "${#files[@]}" == 1 ]]
          name="$(basename "${files[0]}")"
          [[ "$name" =~ ^[0-9]{14}_artales_identity_lifecycle_v1[.]sql$ ]]
          [[ "${name:0:14}" > 20261128094513 ]]
          echo "ARTALES_CANONICAL_FILENAME=$name"
          sha256sum "$GITHUB_WORKSPACE/tests/db/artalesIdentityLifecycleCandidate.sql"
      - name: Prove identity lifecycle and transactional invitation races
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
        run: bash tests/db/artalesIdentityLifecycleIsolation.sh tests/db/artalesIdentityLifecycleCandidate.sql
  invite-boundary-application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Scoped lint
        run: npx eslint lib/dbInvites.ts lib/inviteTokenLookup.ts tests/inviteTokenLookup.test.ts
      - run: npx tsx --test tests/inviteTokenLookup.test.ts
      - name: Inspect invite lookup call sites
        run: git grep -n -E 'getInviteByToken|lookupPendingInviteByToken|artales_find_pending_invite_for_email' -- '*.ts' '*.tsx'
