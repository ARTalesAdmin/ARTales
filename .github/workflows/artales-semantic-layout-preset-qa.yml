name: ARTales semantic layout preset QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'lib/semantic/layoutPresets.ts'
      - 'tests/semanticLayoutPresets.test.ts'
      - '.github/workflows/artales-semantic-layout-preset-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx --test tests/semanticLayoutPresets.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint lib/semantic/layoutPresets.ts tests/semanticLayoutPresets.test.ts
