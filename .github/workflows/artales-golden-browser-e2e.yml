name: ARTales authenticated golden browser E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/browser/**'
      - 'tests/golden/**'
      - 'supabase/**'
      - 'app/member/**'
      - 'app/api/member/**'
      - 'app/login/**'
      - 'components/**'
      - '.github/workflows/artales-golden-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artales-golden-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-e2e:
    name: Browser + real local Auth/DB/Storage (no mocks)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GOLDEN_E2E_ISOLATED: 'yes'
      NEXT_PUBLIC_ARTALES_SEMANTIC_PIPELINE_V1: 'enabled'
      ARTALES_SNAPSHOT_GENERAL_V1: 'enabled'
      PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use runner Google Chrome with pinned Playwright driver
        run: |
          command -v google-chrome
          npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Start disposable local Supabase, replay all checked-in migrations
        run: |
          test ! -f .supabase/.branches/_current_branch
          npx supabase@2.81.3 start
      - name: Start actual ARTales Next server against local-only Supabase
        run: |
          npx supabase@2.81.3 status -o env >/tmp/golden-local-supabase.env
          set -a
          . /tmp/golden-local-supabase.env
          set +a
          test "$API_URL" = "http://127.0.0.1:54321"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >>"$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >>"$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >>"$GITHUB_ENV"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npx next dev --hostname 127.0.0.1 --port 3000 > /tmp/golden-next.log 2>&1 &
          echo $! >/tmp/golden-next.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3000/login -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/golden-next.log | tail -n 60
          exit 1
      - name: Browser E2E must reach database, not a mocked API
        run: npx playwright test tests/browser/golden.editorial.spec.cjs --reporter=line --workers=1
      - name: Failure evidence (no keys, no user data)
        if: failure()
        run: |
          if test -f /tmp/golden-next.log; then grep -E 'Error|error|failed|FAIL' /tmp/golden-next.log | tail -n 40 || true; fi
      - name: Stop disposable services
        if: always()
        run: |
          if test -f /tmp/golden-next.pid; then kill "$(cat /tmp/golden-next.pid)" || true; fi
          npx supabase@2.81.3 stop --no-backup || true
