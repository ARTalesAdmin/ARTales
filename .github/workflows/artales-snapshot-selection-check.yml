name: ARTales snapshot selection S0 checks
on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/ingest/**'
      - 'app/member/snapshot/**'
      - 'components/snapshot/**'
      - 'tests/snapshotLegalInlineAction.test.mjs'
      - 'app/member/candidates/[id]/legal/page.tsx'
      - 'supabase/migrations/20261027130000_artales_snapshot_general_v1.sql'
      - 'supabase/migrations/20261027131000_artales_snapshot389_register.sql'
      - 'docs/handoffs/ARTALES_SNAPSHOT_GENERALIZATION_2026-10-27.md'
      - 'app/api/member/snapshot/**'
      - 'app/member/admin/snapshot-389/**'
      - 'supabase/migrations/20261027083000_snapshot389_storage_admin_rls.sql'
      - 'docs/handoffs/ARTALES_SNAPSHOT_389_PILOT_2026-10-27.md'
      - 'lib/legal/gutenbergCatalog.ts'
      - 'tests/lockedSnapshotSelection.test.ts'
      - 'tests/rawSourceSnapshot.test.mjs'
      - 'tests/verifiedLegalSnapshotHandoff.test.mjs'
      - 'tests/snapshot389Pilot.test.mjs'
      - 'tests/snapshot389Mirror.test.mjs'
      - 'tests/snapshot389RequestGate.test.mjs'
      - 'tests/snapshot389Security.test.mjs'
      - 'tests/generalSnapshotAction.test.mjs'
      - 'tests/generalSnapshotPreflight.test.mjs'
      - 'lib/ingest/generalSnapshotPreflight.ts'
      - 'tests/gutenbergSnapshotAcquisition.test.mjs'
      - 'tests/legal-gutenberg-detail-retry.test.ts'
      - '.github/workflows/artales-snapshot-selection-check.yml'
permissions:
  contents: read
jobs:
  snapshot-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx --test tests/lockedSnapshotSelection.test.ts
      - run: node --experimental-strip-types --test tests/rawSourceSnapshot.test.mjs
      - run: npx tsx --test tests/verifiedLegalSnapshotHandoff.test.mjs
      - run: npx tsx --test tests/snapshot389Pilot.test.mjs
      - run: npx tsx --test tests/snapshot389Mirror.test.mjs
      - run: npx tsx --test tests/snapshot389RequestGate.test.mjs
      - run: node --test tests/snapshot389Security.test.mjs
      - run: npx tsx --test tests/generalSnapshotAction.test.mjs
      - run: npx tsx --test tests/generalSnapshotPreflight.test.mjs
      - run: node --test tests/snapshotLegalInlineAction.test.mjs
      - run: npx tsx --test tests/gutenbergSnapshotAcquisition.test.mjs
      - run: npx tsx --test tests/legal-gutenberg-detail-retry.test.ts
      - run: npx tsc --noEmit
      - run: node --test tests/generalSnapshotSchema.test.mjs
      - run: npx eslint lib/ingest/lockedSnapshotSelection.ts lib/ingest/rawSourceSnapshot.ts lib/ingest/rawSourceArchive.ts lib/ingest/verifiedLegalSnapshotHandoff.ts lib/ingest/snapshot389Pilot.ts lib/ingest/snapshot389Mirror.ts lib/ingest/server/readLockedSnapshotPacket.ts lib/ingest/server/snapshot389RequestGate.ts app/api/member/snapshot/389/route.ts app/member/admin/snapshot-389/page.tsx tests/lockedSnapshotSelection.test.ts tests/rawSourceSnapshot.test.mjs tests/verifiedLegalSnapshotHandoff.test.mjs tests/snapshot389Pilot.test.mjs tests/snapshot389Mirror.test.mjs tests/snapshot389RequestGate.test.mjs tests/snapshot389Security.test.mjs lib/ingest/generalSnapshotAction.ts lib/ingest/server/getCandidateSnapshotState.ts app/member/snapshot/[candidateId]/page.tsx app/member/candidates/[id]/legal/page.tsx components/snapshot/SnapshotActionPanel.tsx lib/ingest/generalSnapshotPreflight.ts lib/ingest/gutenbergSnapshotAcquisition.ts app/api/member/snapshot/[candidateId]/route.ts tests/generalSnapshotAction.test.mjs tests/generalSnapshotPreflight.test.mjs tests/gutenbergSnapshotAcquisition.test.mjs

  snapshot-389-live-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ARTALES_SNAPSHOT_389_LIVE_MIRROR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx --test tests/snapshot389Mirror.test.mjs
