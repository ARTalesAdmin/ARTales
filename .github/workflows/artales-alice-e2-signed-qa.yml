name: ARTales Alice E2 signed draft QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'supabase/ci/alice_e2_signed_draft_assembly.sql'
      - 'supabase/ci/test_alice_e2_signed.sql'
      - 'lib/semantic/dbAComponentBridge.ts'
      - 'tests/dbAComponentBridge.test.ts'
      - '.github/workflows/artales-alice-e2-signed-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-e2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase init --force
      - name: Start disposable local database
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply provisional E2 to disposable local DB only
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/ci/alice_e2_signed_draft_assembly.sql
      - name: Verify privileges and immutable structure
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/ci/test_alice_e2_signed.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: DB-A exact source bridge and negative tests
        run: npx tsx --test tests/dbAComponentBridge.test.ts
      - name: TypeScript and bridge lint
        run: |
          npx tsc --noEmit
          npx eslint lib/semantic/dbAComponentBridge.ts tests/dbAComponentBridge.test.ts
      - name: Destroy local project without backup
        if: always()
        run: supabase stop --no-backup
