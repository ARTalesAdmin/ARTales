name: ARTales reader cutover dry run QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'lib/publication/readerCutoverDryRun.ts'
      - 'tests/readerCutoverDryRun.test.ts'
      - '.github/workflows/artales-reader-cutover-dryrun-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx --test tests/readerCutoverDryRun.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint lib/publication/readerCutoverDryRun.ts tests/readerCutoverDryRun.test.ts
