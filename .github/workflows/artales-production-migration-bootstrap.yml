name: ARTales production migration runner bootstrap (NO APPLY)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/artales-production-migration-bootstrap.yml'
      - 'scripts/artales-production-runner-contract.mjs'
      - 'tests/artalesProductionRunnerContract.test.mjs'
      - 'scripts/artales-production-plan-review.mjs'
      - 'scripts/artales-production-plan-review-cli.mjs'
      - 'tests/artalesProductionPlanReview.test.mjs'
      - 'docs/protocols/ARTALES_PRODUCTION_RUNNER_BOOTSTRAP_V0.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runner has no write capability
        run: node --test tests/artalesProductionRunnerContract.test.mjs tests/artalesProductionPlanReview.test.mjs
      - name: Verify canonical applied migration identities
        run: node scripts/check-artales-production-migration-canon.mjs
      - name: Verify existing offline migration admission
        run: node --test tests/artalesMigrationAdmission.test.mjs tests/artalesMigrationPlanV01.test.mjs
      - name: Declare bootstrap result
        run: echo 'SOURCE_ONLY_NO_PROVIDER_ACCESS_NO_PRODUCTION_APPLY'
