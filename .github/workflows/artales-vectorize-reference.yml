name: ARTales reference vectorization diagnostics

on:
  workflow_dispatch:
    inputs:
      config:
        description: Reference vectorization configuration
        required: true
        type: choice
        options:
          - artales-symbol.v0.1.json
          - artales-light-lockup.v0.1.json
          - artales-dark-lockup.v0.1.json
      mode:
        description: Vectorization mode
        required: true
        default: single
        type: choice
        options:
          - single
          - matrix
          - candidate
      candidate_variant:
        description: Candidate trace_matrix variant id
        required: false
        default: smoother
        type: string

permissions:
  contents: read

jobs:
  vectorize-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python image tooling
        run: python -m pip install Pillow CairoSVG

      - name: Install optional potrace
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes potrace

      - name: Generate diagnostics
        run: |
          if [ "${{ inputs.mode }}" = "matrix" ]; then
            python tools/brand/vectorize-reference/vectorize_reference.py \
              --config tools/brand/vectorize-reference/config/${{ inputs.config }} \
              --matrix
          elif [ "${{ inputs.mode }}" = "candidate" ]; then
            python tools/brand/vectorize-reference/vectorize_reference.py \
              --config tools/brand/vectorize-reference/config/${{ inputs.config }} \
              --candidate-from-matrix "${{ inputs.candidate_variant }}"
          else
            python tools/brand/vectorize-reference/vectorize_reference.py \
              --config tools/brand/vectorize-reference/config/${{ inputs.config }}
          fi

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: artales-vectorization-${{ inputs.config }}
          path: |
            tools/brand/vectorize-reference/output/
            brand/artales/candidates/symbol-pen-drop/
          if-no-files-found: error
