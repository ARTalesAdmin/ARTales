name: ARTales exact migration admission (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/artales-migration-*'
      - 'tests/artalesMigrationAdmission.test.mjs'
      - 'tests/artalesMigrationCliEvidence.test.mjs'
      - 'tests/artalesMigrationPlanV01.test.mjs'
      - 'supabase/migrations/**'
      - 'docs/protocols/ARTALES_MIGRATION_PLAN_OPERATOR_SELECTION_V0.md'
      - 'tests/artalesPlanRoleAudit.test.mjs'
      - 'tests/artalesPlanRolePgProof.sh'
      - 'tests/sql/artalesPlanRoleFixture.sql'
      - 'docs/protocols/ARTALES_MIGRATION_PLAN_V01.md'
      - 'docs/handoffs/ARTALES_MIGRATION_OPERATOR_SELECTION_PHOENIX_2026-10-28.md'
      - '.github/workflows/artales-migration-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check canonical existing ledger identities
        run: node scripts/check-artales-production-migration-canon.mjs
      - name: Test fail-closed admission
        run: node --test tests/artalesMigrationAdmission.test.mjs
      - name: Test synthetic CLI migration list and dry-run transcripts
        run: node --test tests/artalesMigrationCliEvidence.test.mjs
      - name: Test Supabase CLI 2.122.0 JSON PLAN contract
        run: node --test tests/artalesMigrationPlanV01.test.mjs
      - name: Test fail-closed proposed role privilege audit
        run: node --test tests/artalesPlanRoleAudit.test.mjs

  disposable-postgres-17-role-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-do-not-use
          POSTGRES_DB: artales_plan_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d artales_plan_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure Postgres client for disposable CI database
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Prove narrow table grants AND inherited PUBLIC SECURITY DEFINER risk
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: artales_plan_disposable
          PGUSER: postgres
          PGPASSWORD: fixture-only-do-not-use
        run: bash tests/artalesPlanRolePgProof.sh
