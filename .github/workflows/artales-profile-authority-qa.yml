name: ARTales profile authority local security QA
on:
  pull_request:
    branches: [develop]
    paths:
      - 'supabase/ci/profile_authority_lockdown_assembly.sql'
      - 'supabase/ci/test_profile_authority_lockdown.sql'
      - 'supabase/ci/test_profile_authority_signed_e2e.mjs'
      - 'supabase/ci/test_profile_auth_trigger_parity.sql'
      - 'supabase/ci/test_profile_invite_seed.sql'
      - '.github/workflows/artales-profile-authority-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start isolated local database
        run: |
          supabase init --force
          supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply authority restrictions only in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/ci/profile_authority_lockdown_assembly.sql
      - name: Assert role protections and profile compatibility
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/ci/test_profile_authority_lockdown.sql
      - name: Match production auth trigger in disposable local fixture
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/ci/test_profile_auth_trigger_parity.sql
      - name: Signed GoTrue and PostgREST privilege regression
        run: node supabase/ci/test_profile_authority_signed_e2e.mjs
      - name: Generate canonical migration via Supabase CLI in disposable runner
        run: |
          supabase migration new artales_profile_authority_hardening
          migration="$(find supabase/migrations -maxdepth 1 -type f -name '*_artales_profile_authority_hardening.sql' | head -n 1)"
          test -n "$migration"
          echo "GENERATED_MIGRATION=$migration"
          cp supabase/ci/profile_authority_lockdown_assembly.sql "$migration"
      - name: Verify generated migration on fresh Supabase reset
        run: |
          supabase db reset --local --yes
          psql -X -v ON_ERROR_STOP=1 -f supabase/ci/test_profile_authority_lockdown.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/ci/test_profile_auth_trigger_parity.sql
          node supabase/ci/test_profile_authority_signed_e2e.mjs
          supabase migration list --local
      - name: Discard isolated database
        if: always()
        run: supabase stop --no-backup
