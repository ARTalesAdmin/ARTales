<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" role="img" aria-labelledby="title description">
  <title id="title">ARTales typographic wordmark options board — review only</title>
  <desc id="description">Six live-text system-serif directions for human visual comparison. Each displays ARTales without a symbol. Awaiting human visual review; not a master or lockup.</desc>
  <metadata>
    status: review_only; approval_state: awaiting_human_visual_review; review_only: true; not_master: true; not_candidate: true; not_lockup: true; publicIntegration: false; live_text: true; symbol_used_in_board: false
  </metadata>

  <g fill="currentColor">
    <text x="72" y="62" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">ARTALES TYPOGRAPHIC DIRECTION REVIEW</text>
    <text x="72" y="94" font-family="sans-serif" font-size="15">Review only · live text · not master · no symbol</text>

    <g transform="translate(72 142)">
      <text y="0" font-family="sans-serif" font-size="17" font-weight="700">Option A — Classic literary serif</text>
      <text y="82" font-family="Georgia, 'Times New Roman', Times, serif" font-size="72" font-weight="400" letter-spacing="-1">ARTales</text>
      <text y="120" font-family="sans-serif" font-size="14">Georgia, 'Times New Roman', Times, serif · review only / live text / not master</text>
    </g>

    <g transform="translate(72 308)">
      <text y="0" font-family="sans-serif" font-size="17" font-weight="700">Option B — Refined editorial serif</text>
      <text y="82" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', serif" font-size="72" font-weight="400" letter-spacing="-1">ARTales</text>
      <text y="120" font-family="sans-serif" font-size="14">'Palatino Linotype', Palatino, 'Book Antiqua', serif · review only / live text / not master</text>
    </g>

    <g transform="translate(72 474)">
      <text y="0" font-family="sans-serif" font-size="17" font-weight="700">Option C — Humanist / book serif</text>
      <text y="82" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="72" font-weight="400" letter-spacing="-1">ARTales</text>
      <text y="120" font-family="sans-serif" font-size="14">'Iowan Old Style', 'Palatino Linotype', Palatino, serif · review only / live text / not master</text>
    </g>

    <g transform="translate(72 640)">
      <text y="0" font-family="sans-serif" font-size="17" font-weight="700">Option D — Transitional serif</text>
      <text y="82" font-family="'Times New Roman', Times, serif" font-size="72" font-weight="400" letter-spacing="-1">ARTales</text>
      <text y="120" font-family="sans-serif" font-size="14">'Times New Roman', Times, serif · review only / live text / not master</text>
    </g>

    <g transform="translate(72 806)">
      <text y="0" font-family="sans-serif" font-size="17" font-weight="700">Option E — Elegant high-contrast serif</text>
      <text y="82" font-family="Cambria, Georgia, serif" font-size="72" font-weight="400" letter-spacing="-1">ARTales</text>
      <text y="120" font-family="sans-serif" font-size="14">Cambria, Georgia, serif · review only / live text / not master</text>
    </g>

    <g transform="translate(72 972)">
      <text y="0" font-family="sans-serif" font-size="17" font-weight="700">Option F — Neutral fallback serif</text>
      <text y="82" font-family="serif" font-size="72" font-weight="400" letter-spacing="-1">ARTales</text>
      <text y="120" font-family="sans-serif" font-size="14">serif · review only / live text / not master</text>
    </g>
  </g>
</svg>
